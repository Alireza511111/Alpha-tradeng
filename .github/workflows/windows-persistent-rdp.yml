name: Persistent RDP

on:
  workflow_dispatch:
  repository_dispatch:
    types: [restart]

permissions:
  contents: read
  actions: write

jobs:
  rdp-server:
    runs-on: windows-latest
    timeout-minutes: 355

    env:
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      MEGA_USERNAME: ${{ secrets.MEGA_USERNAME }}
      MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}

    steps:
      - name: Enable RDP + Create User
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          
          $Password = ConvertTo-SecureString "P@ssw0rd1qazXSW@#" -AsPlainText -Force
          New-LocalUser -Name "NvDAdmin" -Password $Password -PasswordNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "NvDAdmin"
          net user runneradmin P@ssw0rd1qazXSW@#

      - name: Install Tailscale
        run: |
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "$env:TEMP\tailscale.msi"
          Start-Process msiexec -ArgumentList "/i $env:TEMP\tailscale.msi /quiet" -Wait
          Start-Sleep -Seconds 10

          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=$env:TAILSCALE_AUTHKEY --hostname="github-rdp-$(Get-Random)" --accept-routes --accept-dns=false
          
          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4

          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "  >>> RDP SERVER IS READY! <<<" -ForegroundColor Cyan
          Write-Host "  Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host "  Username     : NvDAdmin" -ForegroundColor Yellow
          Write-Host "  Password     : P@ssw0rd1qazXSW@#" -ForegroundColor Yellow
          Write-Host "==================================================" -ForegroundColor Green

      - name: Install rclone + Restore & Backup Setup
        run: |
          Invoke-WebRequest "https://downloads.rclone.org/rclone-current-windows-amd64.zip" -OutFile "rclone.zip"
          Expand-Archive -Path "rclone.zip" -DestinationPath "C:\rclone" -Force
          Move-Item -Path "C:\rclone\rclone-*-windows-amd64\rclone.exe" -Destination "C:\Windows\System32\rclone.exe" -Force

          rclone config create mega mega user $env:MEGA_USERNAME pass $env:MEGA_PASSWORD --non-interactive
          
          # ایجاد پوشه به صورت مطمئن
          New-Item -ItemType Directory -Path "C:\UserData" -Force | Out-Null
          New-Item -ItemType Directory -Path "C:\TempBackup" -Force | Out-Null

          Write-Host "Restoring files from Mega.nz..." -ForegroundColor Green
          rclone sync mega:GitHubRDP C:\UserData --create-empty-src-dirs --progress

      - name: Keep Alive + Auto Backup & Restart
        run: |
          Write-Host "Server is running. Will restart automatically after ~5.5 hours." -ForegroundColor Cyan
          
          for ($i = 1; $i -le 330; $i++) {
            Start-Sleep -Seconds 60
            if ($i % 30 -eq 0) { Write-Host "Uptime: $i minutes" }
          }

          Write-Host "=== Saving files to Mega.nz and restarting workflow ===" -ForegroundColor Magenta
          
          # بک‌آپ امن‌تر
          rclone copy C:\UserData mega:GitHubRDP --progress --ignore-errors
          
          $repo = "${{ github.repository }}"
          $token = "${{ secrets.GITHUB_TOKEN }}"
          $header = @{ 
            Authorization = "token $token"
            "Content-Type" = "application/json" 
          }
          $body = @{ event_type = "restart" } | ConvertTo-Json
          
          Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$repo/dispatches" -Headers $header -Body $body
