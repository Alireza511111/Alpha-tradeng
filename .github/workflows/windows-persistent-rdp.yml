name: Windows Persistent RDP + Mega Backup

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Windows Persistent RDP + Mega Backup"]
    types:
      - completed

jobs:
  rdp-server:
    runs-on: windows-latest
    timeout-minutes: 355

    env:
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      MEGA_USERNAME: ${{ secrets.MEGA_USERNAME }}
      MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}

    steps:
      - name: 1. Enable Remote Desktop & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0

      - name: 2. Create Admin Account
        run: |
          $Password = ConvertTo-SecureString "P@ssw0rd1qazXSW@#" -AsPlainText -Force
          New-LocalUser -Name "NvDAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "NvDAdmin" -ErrorAction SilentlyContinue
          net user runneradmin P@ssw0rd1qazXSW@#

      - name: 3. Install Tailscale
        run: |
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "$env:TEMP\tailscale.msi"
          Start-Process msiexec -ArgumentList "/i $env:TEMP\tailscale.msi /quiet" -Wait
          Start-Sleep -Seconds 8

          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=$env:TAILSCALE_AUTHKEY --hostname="github-rdp-$(Get-Random)" --accept-routes --accept-dns=false
          
          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          echo "TAILSCALE_IP=$ts_ip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "  RDP SERVER READY!" -ForegroundColor Cyan
          Write-Host "  Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host "  User         : NvDAdmin" -ForegroundColor Yellow
          Write-Host "  Pass         : P@ssw0rd1qazXSW@#" -ForegroundColor Yellow
          Write-Host "==================================================" -ForegroundColor Green

      - name: 4. Install rclone & Restore Files from Mega
        run: |
          Invoke-WebRequest "https://downloads.rclone.org/rclone-current-windows-amd64.zip" -OutFile "rclone.zip"
          Expand-Archive -Path "rclone.zip" -DestinationPath "C:\rclone" -Force
          Move-Item -Path "C:\rclone\rclone-*-windows-amd64\rclone.exe" -Destination "C:\Windows\System32\rclone.exe"

          rclone config create mega mega user $env:MEGA_USERNAME pass $env:MEGA_PASSWORD --non-interactive

          New-Item -ItemType Directory -Path "C:\UserData" -Force | Out-Null
          rclone sync mega:GitHubRDP C:\UserData --create-empty-src-dirs --progress

          Write-Host "Files restored from Mega.nz successfully." -ForegroundColor Green

      - name: 5. Keep Alive + Auto Backup & Restart
        run: |
          $maxMinutes = 340
          for ($i = 1; $i -le $maxMinutes; $i++) {
            Start-Sleep -Seconds 60
            if ($i % 30 -eq 0) { Write-Host "[$i/$maxMinutes] Server is running..." }
          }

          Write-Host "=== Starting backup and self-restart ===" -ForegroundColor Magenta

          rclone sync C:\UserData mega:GitHubRDP --progress --delete-before

          $repo = "${{ github.repository }}"
          $token = "${{ secrets.GITHUB_TOKEN }}"
          $header = @{ Authorization = "token $token"; "Content-Type" = "application/json" }
          $body = @{ ref = "main" } | ConvertTo-Json

          Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$repo/actions/workflows/windows-persistent-rdp.yml/dispatches" -Headers $header -Body $body
