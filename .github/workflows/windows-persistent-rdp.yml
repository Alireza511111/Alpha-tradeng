name: Persistent RDP

on:
  workflow_dispatch:

jobs:
  rdp-server:
    runs-on: windows-latest
    timeout-minutes: 355

    env:
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}

    steps:
      - name: Enable RDP & Create User
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          
          $Password = ConvertTo-SecureString "P@ssw0rd1qazXSW@#" -AsPlainText -Force
          New-LocalUser -Name "NvDAdmin" -Password $Password -PasswordNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "NvDAdmin"
          net user runneradmin P@ssw0rd1qazXSW@#

      - name: Install & Connect Tailscale
        run: |
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "$env:TEMP\tailscale.msi"
          Start-Process msiexec -ArgumentList "/i $env:TEMP\tailscale.msi /quiet" -Wait
          Start-Sleep -Seconds 10

          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=$env:TAILSCALE_AUTHKEY --hostname="github-rdp-$(Get-Random)" --accept-routes --accept-dns=false
          
          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4

          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "  >>> SERVER IS READY <<<" -ForegroundColor Cyan
          Write-Host "  Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host "  Username     : NvDAdmin" -ForegroundColor Yellow
          Write-Host "  Password     : P@ssw0rd1qazXSW@#" -ForegroundColor Yellow
          Write-Host "==================================================" -ForegroundColor Green

      - name: Keep Alive (5.5 Hours)
        run: |
          Write-Host "Server will stay alive for 5 hours and 40 minutes..." -ForegroundColor Cyan
          for ($i = 1; $i -le 340; $i++) {
            Start-Sleep -Seconds 60
            if ($i % 30 -eq 0) { Write-Host "Uptime: $i minutes" }
          }
          Write-Host "Job finished. Next run needed." -ForegroundColor Magenta
